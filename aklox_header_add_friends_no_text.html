<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0e0e10">
<title>Unex Header</title>
<style>
  :root {
    --page:#0e0e10; --surface:#181619; --border:#38383a;
    --divider:#38383a; --text:#efeff1; --muted:#a0a0a8;
  }
  * { box-sizing:border-box; }
  html, body {
    margin:0; min-height:100%; width:100%; background:var(--page);
    color:var(--text); font-family:Arial, Helvetica, sans-serif;
  }
  body { overflow-x:hidden; }
  /* Keep the desktop-style single row in every browser mode.
     Every dimension is proportional to the actual layout viewport,
     so mobile browser mode scales the whole header instead of stacking it. */
  .topbar {
    width:100%; height:6.55vw; min-height:0;
    padding:0 4.5vw;
    border-bottom:2px solid #242426;
    display:grid;
    grid-template-columns:9vw minmax(0,1fr) 6vw 26vw;
    align-items:center;
    gap:.8vw;
  }
  .brand { display:flex; align-items:center; min-width:0; }
  .brand img { display:block; width:100%; max-width:none; height:auto; object-fit:contain; }
  .search {
    height:4.15vw; min-width:0;
    display:flex; align-items:center; gap:.9vw;
    padding:0 1.25vw;
    background:var(--surface); border:2px solid var(--border);
    border-radius:1.45vw;
  }
  .search img {
    width:1.7vw; height:1.7vw; object-fit:contain; flex:0 0 auto;
  }
  .search input {
    width:100%; min-width:0; border:0; outline:0; background:transparent;
    color:var(--text); font:400 1.65vw/1 Arial,sans-serif; padding:0;
  }
  .search input::placeholder { color:var(--muted); opacity:1; }
  .gift {
    width:100%; height:4.15vw; display:grid; place-items:center;
    background:var(--surface); border:2px solid #202023;
    border-radius:1.45vw; cursor:pointer; padding:0;
  }
  .gift img { width:2.25vw; height:2.25vw; object-fit:contain; }
  .account {
    width:100%; height:4.3vw; min-width:0;
    display:flex; align-items:center; justify-content:space-evenly;
    padding:0 .55vw; gap:.25vw;
    background:var(--surface); border:2px solid var(--border);
    border-radius:1.45vw;
  }
  .avatar { width:2.9vw; height:2.9vw; object-fit:contain; flex:0 0 auto; }
  .divider { width:2px; height:48%; background:var(--divider); flex:0 0 auto; }
  .currency {
    display:flex; align-items:center; gap:.45vw;
    font-size:1.55vw; font-weight:700; white-space:nowrap;
  }
  .currency img { width:2.05vw; height:2.05vw; object-fit:contain; }
  .settings { width:2.2vw; height:2.2vw; object-fit:contain; flex:0 0 auto; cursor:pointer; }
  @media (max-width: 420px) {
    /* Slightly tighten only spacing; never change the desktop row structure. */
    .topbar { gap:.55vw; padding-left:3.5vw; padding-right:3.5vw; }
    .search { padding-left:.9vw; padding-right:.9vw; }
    .search input { font-size:1.6vw; }
    .account { padding-left:.35vw; padding-right:.35vw; }
  }

  .friends-card {
    position:relative;
    width:10vw;
    height:13.25vw;
    margin:1.5vw 0 0 1.6vw;
    border:2px solid #38383a;
    border-radius:2px;
    background:#181619;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:0;
    overflow:hidden;
    cursor:pointer;
    appearance:none;
    color:inherit;
    font:inherit;
  }
  .friends-card::before,
  .friends-card::after {
    content:"";
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    background:#a0a0a8;
    border-radius:999px;
  }
  .friends-card::before { width:2.9vw; height:.42vw; }
  .friends-card::after { width:.42vw; height:2.9vw; }
  .friends-card:focus-visible { outline:2px solid #a879ff; outline-offset:3px; }
</style>
</head>
