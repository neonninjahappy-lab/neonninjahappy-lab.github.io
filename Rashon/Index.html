<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>RASHON IS WATCHING</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000;
      font-family: 'Courier New', Courier, monospace;
      color: #8b0000;
    }

    /* Initial click overlay for browser autoplay policies */
    #start-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: #000;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: #ff0000;
      cursor: pointer;
      text-align: center;
      padding: 20px;
    }

    #start-overlay h1 {
      font-size: 2rem;
      letter-spacing: 4px;
      margin-bottom: 10px;
      text-shadow: 0 0 10px #ff0000;
      animation: pulse 1s infinite alternate;
    }

    #start-overlay p {
      font-size: 0.9rem;
      color: #666;
    }

    @keyframes pulse {
      0% { opacity: 0.3; }
      100% { opacity: 1; }
    }

    /* Vignette overlay */
    .vignette {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      box-shadow: 0 0 150px rgba(0, 0, 0, 0.95) inset;
      pointer-events: none;
      z-index: 2;
    }

    /* Red Screen Flash for Jumpscares */
    #flash {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: #ff0000;
      opacity: 0;
      pointer-events: none;
      z-index: 998;
      transition: opacity 0.05s ease-out;
    }

    /* Dynamic horror text layer */
    #horror-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 1;
    }

    .rashon-text {
      position: absolute;
      color: #8b0000;
      font-weight: bold;
      text-transform: uppercase;
      white-space: nowrap;
      text-shadow: 0 0 8px rgba(255, 0, 0, 0.8), 0 0 15px rgba(0, 0, 0, 0.9);
      animation: floatFade 4s forwards;
    }

    @keyframes floatFade {
      0% {
        opacity: 0;
        transform: scale(0.5) translateY(0);
      }
      20% {
        opacity: 1;
      }
      80% {
        opacity: 0.8;
      }
      100% {
        opacity: 0;
        transform: scale(1.8) translateY(-30px);
      }
    }

    /* Giant Jumpscare Face / Text */
    #jumpscare-face {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0);
      font-size: 15vw;
      font-weight: 900;
      color: #ff0000;
      text-shadow: 0 0 30px #ffffff, 0 0 60px #ff0000;
      z-index: 999;
      pointer-events: none;
      opacity: 0;
      transition: transform 0.05s ease-out, opacity 0.05s ease-out;
    }

    /* Screen shake effect */
    .shake {
      animation: shake 0.15s infinite;
    }

    @keyframes shake {
      0% { transform: translate(3px, 3px) rotate(0deg); }
      20% { transform: translate(-3px, -2px) rotate(-1deg); }
      40% { transform: translate(-4px, 1px) rotate(1deg); }
      60% { transform: translate(3px, 1px) rotate(0deg); }
      80% { transform: translate(1px, -3px) rotate(1deg); }
      100% { transform: translate(-2px, 2px) rotate(-1deg); }
    }
  </style>
</head>
<body>

  <div id="start-overlay">
    <h1>DO NOT TOUCH</h1>
    <p>[ TAP SCREEN TO ENTER RASHON'S REALM ]</p>
  </div>

  <div class="vignette"></div>
  <div id="flash"></div>
  <div id="horror-container"></div>
  <div id="jumpscare-face">RASHON</div>

  <!-- Audio Sources -->
  <audio id="jumpscare-audio" preload="auto">
    <source src="https://www.myinstants.com/media/sounds/fnaf-jumpscare-sound.mp3" type="audio/mpeg">
    <source src="https://assets.mixkit.co/active_storage/sfx/212/212-preview.mp3" type="audio/mpeg">
  </audio>

  <script>
    const container = document.getElementById('horror-container');
    const startOverlay = document.getElementById('start-overlay');
    const flash = document.getElementById('flash');
    const jumpscareFace = document.getElementById('jumpscare-face');
    const audio = document.getElementById('jumpscare-audio');

    let isRunning = false;
    let audioCtx = null;

    // Direct user tap/click initializer
    startOverlay.addEventListener('click', startExperience);
    startOverlay.addEventListener('touchstart', startExperience);

    function startExperience() {
      if (isRunning) return;
      isRunning = true;

      // Hide start overlay
      startOverlay.style.display = 'none';

      // Initialize Web Audio API
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      if (AudioContext) {
        audioCtx = new AudioContext();
      }

      // Warm up audio elements
      audio.play().then(() => {
        audio.pause();
        audio.currentTime = 0;
      }).catch(e => console.log('Audio direct play prevented:', e));

      // Spawn loops
      setInterval(spawnRashonText, 150);
      setInterval(whisperRashon, 2500);
      scheduleJumpscare();
    }

    // Creates dynamic text instances across the screen
    function spawnRashonText() {
      const el = document.createElement('div');
      el.classList.add('rashon-text');
      el.innerText = 'RASHON';

      const x = Math.random() * 90;
      const y = Math.random() * 95;
      const size = Math.random() * 2.5 + 1;

      el.style.left = x + 'vw';
      el.style.top = y + 'vh';
      el.style.fontSize = size + 'rem';
      
      // Slight randomized color variance
      const redVal = Math.floor(Math.random() * 155) + 100;
      el.style.color = `rgb(${redVal}, 0, 0)`;

      container.appendChild(el);

      setTimeout(() => {
        el.remove();
      }, 4000);
    }

    // TTS Creepy Whisper using Web Speech API
    function whisperRashon() {
      if (!('speechSynthesis' in window)) return;

      const synth = window.speechSynthesis;
      const utterance = new SpeechSynthesisUtterance("Rashon");

      utterance.pitch = 0.1;
      utterance.rate = 0.5;
      utterance.volume = 0.8;

      // Select low or english voice if available
      const voices = synth.getVoices();
      const whisperVoice = voices.find(v => v.lang.includes('en') && v.name.toLowerCase().includes('google')) || voices[0];
      if (whisperVoice) {
        utterance.voice = whisperVoice;
      }

      synth.speak(utterance);
    }

    // Synthetic Horror Scream Sound via AudioContext Fallback
    function playSyntheticScream() {
      if (!audioCtx) return;
      
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(800, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.8);

      gain.gain.setValueAtTime(1, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.8);

      osc.connect(gain);
      gain.connect(audioCtx.destination);

      osc.start();
      osc.stop(audioCtx.currentTime + 0.8);
    }

    // Trigger Jumpscare
    function triggerJumpscare() {
      // Audio playback
      audio.currentTime = 0;
      audio.play().catch(() => {
        playSyntheticScream();
      });

      // Flashing visuals and camera shake
      flash.style.opacity = '0.9';
      document.body.classList.add('shake');
      
      jumpscareFace.style.opacity = '1';
      jumpscareFace.style.transform = 'translate(-50%, -50%) scale(1.3)';

      setTimeout(() => {
        flash.style.opacity = '0';
        jumpscareFace.style.opacity = '0';
        jumpscareFace.style.transform = 'translate(-50%, -50%) scale(0)';
        document.body.classList.remove('shake');
      }, 700);

      scheduleJumpscare();
    }

    // Random timing for jumpscares (between 4s and 10s)
    function scheduleJumpscare() {
      const nextTime = Math.random() * 6000 + 4000;
      setTimeout(triggerJumpscare, nextTime);
    }

    // Additional trigger on screen interaction/tap
    window.addEventListener('click', () => {
      if (isRunning && Math.random() > 0.6) {
        triggerJumpscare();
      }
    });
  </script>
</body>
</html>
