<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Welcome to DisCloud</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --bg-main: #121214;
      --bg-surface: #1e1e24;
      --accent-blue: #5865f2;
      --accent-blue-hover: #4752c4;
      --text-primary: #f8f9fa;
      --text-secondary: #a0a0ab;
      --border-color: #2b2b36;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      height: 100%;
      height: 100dvh;
      width: 100vw;
      overflow: hidden;
      background-color: var(--bg-main);
      color: var(--text-primary);
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .auth-card {
      background-color: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 32px;
      width: 100%;
      max-width: 400px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    }

    .auth-logo {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background-color: var(--accent-blue);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      color: #ffffff;
    }

    .auth-title {
      font-size: 22px;
      font-weight: 700;
    }

    .auth-desc {
      font-size: 14px;
      color: var(--text-secondary);
      line-height: 1.4;
    }

    .btn-discord-login {
      width: 100%;
      padding: 12px 20px;
      background-color: var(--accent-blue);
      color: #ffffff;
      border: none;
      border-radius: 6px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: background-color 0.15s ease;
      text-decoration: none;
    }

    .btn-discord-login:hover {
      background-color: var(--accent-blue-hover);
    }

    .status-text {
      font-size: 13px;
      color: var(--text-secondary);
    }
  </style>
</head>
<body>

  <div class="auth-card">
    <div class="auth-logo">
      <i class="fa-brands fa-discord"></i>
    </div>
    <div class="auth-title">Welcome to DisCloud</div>
    <div class="auth-desc">Connect your Discord account to view your servers, text channels, and live messages in real time.</div>
    <button class="btn-discord-login" id="loginBtn">
      <i class="fa-brands fa-discord"></i> Continue with Discord
    </button>
    <div id="statusMessage" class="status-text"></div>
  </div>

  <script>
    const API_BASE_URL = "https://aiwobjgrgqsgjirueaqa.supabase.co/functions/v1/discloud-api";
    const MAIN_APP_URL = "https://cloudfurm.com/disboardMain.html";

    const loginBtn = document.getElementById('loginBtn');
    const statusMessage = document.getElementById('statusMessage');

    loginBtn.addEventListener('click', () => {
      window.location.href = `${API_BASE_URL}/auth/login`;
    });

    async function checkExistingSession() {
      try {
        statusMessage.textContent = "Checking session...";
        const res = await fetch(`${API_BASE_URL}/auth/me`, {
          method: 'GET',
          credentials: 'include'
        });

        if (res.ok) {
          const data = await res.json();
          const user = data.user || data.data?.user || (data.id ? data : null);
          if (user) {
            statusMessage.textContent = "Redirecting to DisCloud...";
            window.location.href = MAIN_APP_URL;
            return;
          }
        }
        statusMessage.textContent = "";
      } catch (err) {
        console.log("No active session found:", err);
        statusMessage.textContent = "";
      }
    }

    checkExistingSession();
  </script>
</body>
</html>
