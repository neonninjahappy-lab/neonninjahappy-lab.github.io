<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>DisCloud</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --bg-main: #121214;
      --bg-surface: #1e1e24;
      --bg-surface-hover: #26262e;
      --bg-tab-active: #2b2b36;
      --accent-blue: #5865f2;
      --accent-blue-hover: #4752c4;
      --accent-green: #2ec4b6;
      --accent-red: #ff7043;
      --accent-online: #3ddc84;
      --accent-idle: #faa61a;
      --accent-dnd: #f04747;
      --accent-offline: #747f8d;
      --text-primary: #f8f9fa;
      --text-secondary: #a0a0ab;
      --border-color: #2b2b36;
      --header-height: 48px;
      --server-sidebar-width: 70px;
      --channel-sidebar-width: 240px;
      --members-sidebar-width: 240px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      height: 100%;
      height: 100dvh;
      width: 100vw;
      overflow: hidden;
      background-color: var(--bg-main);
      color: var(--text-primary);
    }

    body {
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* Top Navigation Bar */
    .top-bar {
      height: var(--header-height);
      min-height: var(--header-height);
      background-color: var(--bg-surface);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
      border-bottom: 1px solid var(--border-color);
      z-index: 50;
      flex-shrink: 0;
      padding-top: env(safe-area-inset-top, 0);
    }

    .top-bar-left, .top-bar-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .channel-title-header {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 600;
      font-size: 15px;
    }

    .icon-btn {
      background: none;
      border: none;
      color: var(--text-secondary);
      font-size: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 6px;
      border-radius: 6px;
      transition: color 0.15s ease, background-color 0.15s ease;
    }

    .icon-btn:hover, .icon-btn:active {
      background-color: var(--bg-tab-active);
      color: var(--text-primary);
    }

    .icon-btn.active {
      color: var(--accent-blue);
    }

    /* App Workspace Container */
    .app-container {
      flex: 1;
      display: flex;
      position: relative;
      overflow: hidden;
    }

    /* Left Drawer / Nav Wrapper */
    .nav-wrapper {
      display: flex;
      height: 100%;
      z-index: 40;
      background-color: var(--bg-main);
      transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    @media (max-width: 768px) {
      .nav-wrapper {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        transform: translateX(-100%);
      }
      .nav-wrapper.active {
        transform: translateX(0);
      }
    }

    /* Server Sidebar */
    .server-sidebar {
      width: var(--server-sidebar-width);
      min-width: var(--server-sidebar-width);
      background-color: var(--bg-main);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 12px 0;
      gap: 10px;
      overflow-y: auto;
      scrollbar-width: none;
    }
    .server-sidebar::-webkit-scrollbar { display: none; }

    .server-icon {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background-color: var(--bg-surface);
      border: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 15px;
      font-weight: 600;
      color: var(--text-primary);
      position: relative;
      transition: all 0.2s ease;
      user-select: none;
      background-size: cover;
      background-position: center;
    }

    .server-icon:hover {
      border-color: var(--accent-blue);
      border-radius: 10px;
    }

    .server-icon.active {
      border-color: var(--accent-blue);
      background-color: var(--bg-tab-active);
      border-radius: 10px;
    }

    .server-icon.active::before {
      content: '';
      position: absolute;
      left: -12px;
      top: 10px;
      bottom: 10px;
      width: 4px;
      background-color: var(--accent-blue);
      border-radius: 0 4px 4px 0;
    }

    .server-separator {
      width: 32px;
      height: 2px;
      background-color: var(--border-color);
      border-radius: 1px;
      margin: 2px 0;
    }

    /* Channel Sidebar */
    .channel-sidebar {
      width: var(--channel-sidebar-width);
      min-width: var(--channel-sidebar-width);
      background-color: var(--bg-surface);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
    }

    @media (max-width: 768px) {
      .channel-sidebar {
        flex: 1;
        width: auto;
      }
    }

    .channel-header {
      height: var(--header-height);
      padding: 0 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border-color);
      font-weight: 600;
      font-size: 14px;
    }

    .channel-list {
      flex: 1;
      overflow-y: auto;
      padding: 12px 8px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .channel-category {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .category-header {
      font-size: 11px;
      font-weight: 700;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      padding: 4px 6px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      user-select: none;
    }

    .category-header:hover {
      color: var(--text-primary);
    }

    .channel-item {
      padding: 7px 10px;
      border-radius: 6px;
      font-size: 13px;
      color: var(--text-secondary);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      user-select: none;
      transition: background-color 0.15s ease, color 0.15s ease;
    }

    .channel-item:hover {
      background-color: var(--bg-surface-hover);
      color: var(--text-primary);
    }

    .channel-item.active {
      background-color: var(--bg-tab-active);
      color: var(--text-primary);
      font-weight: 500;
    }

    /* Active Voice Overlay Panel in Channels */
    .voice-control-panel {
      background-color: #16161a;
      border-top: 1px solid var(--border-color);
      padding: 10px;
      display: none;
      flex-direction: column;
      gap: 8px;
    }

    .voice-control-panel.active {
      display: flex;
    }

    .voice-status-info {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
    }

    .voice-status-label {
      color: var(--accent-online);
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .voice-actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }

    .voice-action-btn {
      flex: 1;
      padding: 6px;
      background: var(--bg-main);
      border: 1px solid var(--border-color);
      border-radius: 4px;
      color: var(--text-primary);
      font-size: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }

    .voice-action-btn.danger {
      color: var(--accent-red);
      border-color: rgba(255, 112, 67, 0.3);
    }

    /* User Profile Bar (Read-Only) */
    .user-profile-bar {
      height: 52px;
      background-color: #141417;
      border-top: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 10px;
      cursor: pointer;
      user-select: none;
      padding-bottom: env(safe-area-inset-bottom, 0);
    }

    .user-profile-bar:hover {
      background-color: var(--bg-surface-hover);
    }

    .user-info {
      display: flex;
      align-items: center;
      gap: 10px;
      overflow: hidden;
    }

    .avatar-wrap {
      position: relative;
      width: 32px;
      height: 32px;
      flex-shrink: 0;
    }

    .avatar {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: var(--accent-blue);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      color: #fff;
      font-size: 13px;
      background-size: cover;
      background-position: center;
    }

    .status-dot {
      position: absolute;
      bottom: -1px;
      right: -1px;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background-color: var(--accent-online);
      border: 2px solid var(--bg-surface);
    }

    .status-dot.idle { background-color: var(--accent-idle); }
    .status-dot.dnd { background-color: var(--accent-dnd); }
    .status-dot.offline { background-color: var(--accent-offline); }

    .user-details {
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .user-name {
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .user-tag {
      font-size: 10px;
      color: var(--text-secondary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Main Chat Workspace */
    .chat-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      background-color: var(--bg-main);
      height: 100%;
      min-width: 0;
    }

    .messages-container {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .message {
      display: flex;
      gap: 12px;
      font-size: 13px;
      padding: 4px 6px;
      border-radius: 6px;
      transition: background-color 0.15s ease;
      position: relative;
    }

    .message:hover {
      background-color: rgba(255, 255, 255, 0.02);
    }

    .message-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-width: 0;
    }

    .message-header {
      display: flex;
      align-items: baseline;
      gap: 8px;
    }

    .message-author {
      font-weight: 600;
      color: var(--text-primary);
    }

    .message-time {
      font-size: 10px;
      color: var(--text-secondary);
    }

    .message-text {
      color: #d1d1d6;
      line-height: 1.45;
      white-space: pre-wrap;
      word-break: break-word;
    }

    /* Message Input Box */
    .message-input-area {
      padding: 12px;
      background-color: var(--bg-main);
      padding-bottom: calc(12px + env(safe-area-inset-bottom, 0));
      position: relative;
    }

    .message-input-wrapper {
      background-color: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      display: flex;
      align-items: center;
      padding: 0 8px;
      gap: 6px;
    }

    .message-input-wrapper:focus-within {
      border-color: var(--accent-blue);
    }

    .message-input {
      flex: 1;
      background: none;
      border: none;
      outline: none;
      color: var(--text-primary);
      padding: 10px 4px;
      font-size: 13px;
      max-height: 120px;
      resize: none;
    }

    /* Custom Emoji Picker Popup */
    .emoji-picker-popup {
      position: absolute;
      bottom: 60px;
      right: 12px;
      width: 300px;
      height: 240px;
      background-color: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      display: none;
      flex-direction: column;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
      z-index: 100;
      overflow: hidden;
    }

    .emoji-picker-popup.active {
      display: flex;
    }

    .emoji-picker-header {
      padding: 8px 12px;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-secondary);
      border-bottom: 1px solid var(--border-color);
      background: var(--bg-main);
    }

    .emoji-picker-body {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .emoji-section-title {
      font-size: 11px;
      color: var(--text-secondary);
      font-weight: 700;
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    .emoji-grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 4px;
    }

    .emoji-cell {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 18px;
      padding: 6px;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-primary);
    }

    .emoji-cell:hover {
      background-color: var(--bg-tab-active);
    }

    /* Home / Friends View Styling */
    .home-view-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      background-color: var(--bg-main);
      height: 100%;
      overflow: hidden;
    }

    .friends-header-tabs {
      height: 48px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      padding: 0 16px;
      gap: 16px;
      background-color: var(--bg-surface);
    }

    .friend-tab-btn {
      background: none;
      border: none;
      color: var(--text-secondary);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 4px;
    }

    .friend-tab-btn.active {
      color: var(--text-primary);
      background-color: var(--bg-tab-active);
    }

    .friends-content-body {
      flex: 1;
      display: flex;
      overflow: hidden;
    }

    .friends-list-pane {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .friend-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 12px;
      border-radius: 6px;
      border-top: 1px solid rgba(255,255,255,0.03);
    }

    .friend-row:hover {
      background-color: var(--bg-surface);
    }

    /* Desktop Members Sidebar */
    .members-sidebar {
      width: var(--members-sidebar-width);
      min-width: var(--members-sidebar-width);
      background-color: var(--bg-surface);
      border-left: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      padding: 12px 10px;
      gap: 12px;
      overflow-y: auto;
    }

    @media (max-width: 992px) {
      .members-sidebar {
        display: none;
      }
      .members-sidebar.mobile-open {
        display: flex;
        position: absolute;
        right: 0;
        top: 0;
        height: 100%;
        z-index: 45;
        box-shadow: -4px 0 16px rgba(0,0,0,0.4);
      }
    }

    .members-group-title {
      font-size: 11px;
      font-weight: 700;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .member-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 6px;
      border-radius: 6px;
      cursor: pointer;
    }

    .member-item:hover {
      background-color: var(--bg-surface-hover);
    }

    /* Profile Read-Only Drawer Sheet */
    .profile-drawer-overlay {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      background: rgba(0, 0, 0, 0.65);
      z-index: 200;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }

    .profile-drawer-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .profile-sheet {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background-color: var(--bg-surface);
      border-radius: 16px 16px 0 0;
      border-top: 1px solid var(--border-color);
      z-index: 201;
      transform: translateY(100%);
      transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      max-height: 85vh;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      max-width: 500px;
      margin: 0 auto;
    }

    .profile-sheet.active {
      transform: translateY(0);
    }

    .sheet-header-banner {
      height: 90px;
      background: linear-gradient(135deg, var(--accent-blue), #2b2b36);
      position: relative;
    }

    .sheet-avatar-wrap {
      position: absolute;
      bottom: -24px;
      left: 16px;
      width: 64px;
      height: 64px;
      border-radius: 50%;
      border: 4px solid var(--bg-surface);
      background: var(--accent-blue);
    }

    .sheet-avatar-wrap .avatar {
      font-size: 24px;
    }

    .sheet-body {
      padding: 34px 16px 20px 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      padding-bottom: calc(20px + env(safe-area-inset-bottom, 0));
    }

    .profile-card-user {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .profile-card-title {
      font-size: 18px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .profile-card-sub {
      font-size: 12px;
      color: var(--text-secondary);
    }

    /* Authentication & Info Modals */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      background: rgba(0, 0, 0, 0.75);
      z-index: 500;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .modal-overlay.hidden { display: none; }

    .app-modal {
      width: 100%;
      max-width: 420px;
      background-color: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 12px 36px rgba(0,0,0,0.6);
    }

    .modal-header {
      height: 52px;
      background-color: var(--bg-main);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      font-size: 15px;
      font-weight: 600;
      border-bottom: 1px solid var(--border-color);
    }

    .modal-body {
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      font-size: 13px;
      color: var(--text-secondary);
    }

    .auth-input-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .auth-label {
      font-size: 11px;
      font-weight: 700;
      color: var(--text-secondary);
      text-transform: uppercase;
    }

    .auth-input {
      width: 100%;
      background-color: var(--bg-main);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 10px 12px;
      color: var(--text-primary);
      outline: none;
      font-size: 13px;
    }

    .auth-input:focus { border-color: var(--accent-blue); }

    .auth-btn {
      background-color: var(--accent-blue);
      color: #fff;
      border: none;
      padding: 10px 16px;
      border-radius: 6px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      transition: background-color 0.15s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .auth-btn:hover { background-color: var(--accent-blue-hover); }
    .auth-btn:disabled { opacity: 0.6; cursor: not-allowed; }

    .auth-error-msg {
      background: rgba(255, 112, 67, 0.1);
      border: 1px solid rgba(255, 112, 67, 0.3);
      color: var(--accent-red);
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 12px;
      display: none;
    }

    .auth-toggle-text {
      text-align: center;
      font-size: 12px;
      color: var(--text-secondary);
      cursor: pointer;
    }

    .auth-toggle-text span { color: var(--accent-blue); font-weight: 600; }
    .auth-toggle-text span:hover { text-decoration: underline; }
  </style>
</head>
<body>

  <!-- Authentication Modal -->
  <div class="modal-overlay" id="authModalOverlay">
    <div class="app-modal">
      <div class="modal-header">
        <span id="authModalTitle"><i class="fa-solid fa-right-to-bracket" style="color: var(--accent-blue);"></i> Welcome to DisCloud</span>
      </div>
      <div class="modal-body">
        <div class="auth-error-msg" id="authErrorMsg"></div>
        
        <div class="auth-input-group" id="usernameFieldGroup" style="display: none;">
          <label class="auth-label">Username</label>
          <input type="text" class="auth-input" id="authUsernameInput" placeholder="Choose a username" autocomplete="username" />
        </div>

        <div class="auth-input-group">
          <label class="auth-label">Email</label>
          <input type="email" class="auth-input" id="authEmailInput" placeholder="Enter your email" autocomplete="email" />
        </div>

        <div class="auth-input-group">
          <label class="auth-label">Password</label>
          <input type="password" class="auth-input" id="authPasswordInput" placeholder="Enter your password" autocomplete="current-password" />
        </div>

        <button class="auth-btn" id="authSubmitBtn">Log In</button>

        <div class="auth-toggle-text" id="authToggleText">
          Need an account? <span id="authToggleAction">Register</span>
        </div>
      </div>
    </div>
  </div>

  <!-- Top App Navigation Header -->
  <div class="top-bar">
    <div class="top-bar-left">
      <button class="icon-btn" id="toggleNavBtn" title="Toggle Navigation"><i class="fa-solid fa-bars"></i></button>
      <div class="channel-title-header">
        <i class="fa-solid fa-hashtag" id="channelHeaderIcon" style="color: var(--text-secondary);"></i>
        <span id="headerChannelName">friends</span>
      </div>
    </div>
    <div class="top-bar-right">
      <button class="icon-btn" id="logoutBtn" title="Log Out"><i class="fa-solid fa-right-from-bracket"></i></button>
      <button class="icon-btn" id="toggleMembersBtn" title="Toggle Members List"><i class="fa-solid fa-users"></i></button>
    </div>
  </div>

  <!-- Workspace Container -->
  <div class="app-container">
    <!-- Server & Channel Navigation -->
    <div class="nav-wrapper" id="navWrapper">
      <!-- Servers Rail -->
      <div class="server-sidebar" id="serverSidebar">
        <div class="server-icon active" title="Home / Direct Messages"><i class="fa-solid fa-user-group"></i></div>
      </div>

      <!-- Channels List Sidebar -->
      <div class="channel-sidebar" id="channelSidebarContainer">
        <div class="channel-header">
          <span id="serverTitleText">Direct Messages</span>
        </div>

        <div class="channel-list" id="channelListContainer">
          <div class="channel-category">
            <div class="category-header"><span>Direct Messages</span></div>
            <div class="channel-item active" data-id="friends"><i class="fa-solid fa-user"></i> <span>Friends</span></div>
          </div>
          <div class="channel-category" style="margin-top: 10px;">
            <div class="category-header"><span>Text Channels</span></div>
            <div class="channel-item" data-id="general"><i class="fa-solid fa-hashtag"></i> <span>general</span></div>
          </div>
        </div>

        <!-- Voice Call Status Control Bar -->
        <div class="voice-control-panel" id="voiceControlPanel">
          <div class="voice-status-info">
            <span class="voice-status-label"><i class="fa-solid fa-signal"></i> Voice Connected</span>
            <span id="connectedVoiceChannelName" style="color: var(--text-secondary);">/ General</span>
          </div>
          <div class="voice-actions">
            <button class="voice-action-btn" id="voiceMuteBtn"><i class="fa-solid fa-microphone"></i> Mute</button>
            <button class="voice-action-btn" id="voiceDeafenBtn"><i class="fa-solid fa-headphones"></i> Deafen</button>
            <button class="voice-action-btn danger" id="voiceDisconnectBtn"><i class="fa-solid fa-phone-slash"></i></button>
          </div>
        </div>

        <!-- User Profile Bar -->
        <div class="user-profile-bar" id="userProfileBar">
          <div class="user-info">
            <div class="avatar-wrap">
              <div class="avatar" id="barAvatar">U</div>
              <div class="status-dot" id="barStatusDot"></div>
            </div>
            <div class="user-details">
              <div class="user-name" id="barUserName">Loading...</div>
              <div class="user-tag" id="barUserTag">#0000</div>
            </div>
          </div>
          <i class="fa-solid fa-id-badge" style="color: var(--text-secondary); font-size: 14px;"></i>
        </div>
      </div>
    </div>

    <!-- Dynamic Workspace Area -->
    <div class="chat-area" id="mainWorkspaceArea">
      <!-- Rendered dynamically -->
    </div>

    <!-- Desktop Members List -->
    <div class="members-sidebar" id="membersSidebar">
      <div class="members-group-title">Online Members</div>
      <div id="membersListContainer">
        <div class="member-item">
          <div class="avatar-wrap">
            <div class="avatar" style="background:#2ec4b6;">U</div>
            <div class="status-dot"></div>
          </div>
          <div class="user-details">
            <div class="user-name" id="memberUserName">User</div>
            <div class="user-tag">Online</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Read-Only Profile Sheet Drawer -->
  <div class="profile-drawer-overlay" id="profileOverlay"></div>
  <div class="profile-sheet" id="profileSheet">
    <div class="sheet-header-banner">
      <div class="sheet-avatar-wrap">
        <div class="avatar" id="sheetAvatar">U</div>
        <div class="status-dot" id="sheetStatusDot"></div>
      </div>
    </div>
    <div class="sheet-body">
      <div class="profile-card-user">
        <div class="profile-card-title">
          <span id="sheetUserName">User</span>
          <i class="fa-solid fa-circle-check" style="color: var(--accent-blue); font-size: 14px;"></i>
        </div>
        <div class="profile-card-sub" id="sheetUserEmail">user@example.com</div>
      </div>
      <div style="font-size: 12px; color: var(--text-secondary); background: var(--bg-main); padding: 10px; border-radius: 6px; border: 1px solid var(--border-color);">
        <i class="fa-solid fa-shield-halved" style="color: var(--accent-blue); margin-right: 6px;"></i> Connected securely to Supabase Backend Edge Function.
      </div>
    </div>
  </div>

  <script>
    // API Configuration
    const API_BASE_URL = 'https://aiwobjgrgqsgjirueaqa.supabase.co/functions/v1/discloud-native-api';

    // State Store Management
    let authToken = localStorage.getItem('discloud_auth_token') || null;
    let currentUser = null;
    let currentChannelId = 'friends';
    let isRegisterMode = false;

    // DOM Elements
    const authModalOverlay = document.getElementById('authModalOverlay');
    const authModalTitle = document.getElementById('authModalTitle');
    const authErrorMsg = document.getElementById('authErrorMsg');
    const usernameFieldGroup = document.getElementById('usernameFieldGroup');
    const authUsernameInput = document.getElementById('authUsernameInput');
    const authEmailInput = document.getElementById('authEmailInput');
    const authPasswordInput = document.getElementById('authPasswordInput');
    const authSubmitBtn = document.getElementById('authSubmitBtn');
    const authToggleText = document.getElementById('authToggleText');
    const authToggleAction = document.getElementById('authToggleAction');

    const toggleNavBtn = document.getElementById('toggleNavBtn');
    const toggleMembersBtn = document.getElementById('toggleMembersBtn');
    const navWrapper = document.getElementById('navWrapper');
    const membersSidebar = document.getElementById('membersSidebar');
    const channelListContainer = document.getElementById('channelListContainer');
    const mainWorkspaceArea = document.getElementById('mainWorkspaceArea');
    const headerChannelName = document.getElementById('headerChannelName');
    const channelHeaderIcon = document.getElementById('channelHeaderIcon');
    const logoutBtn = document.getElementById('logoutBtn');

    // Profile UI Elements
    const userProfileBar = document.getElementById('userProfileBar');
    const profileOverlay = document.getElementById('profileOverlay');
    const profileSheet = document.getElementById('profileSheet');
    const barAvatar = document.getElementById('barAvatar');
    const barUserName = document.getElementById('barUserName');
    const barUserTag = document.getElementById('barUserTag');
    const barStatusDot = document.getElementById('barStatusDot');
    const sheetAvatar = document.getElementById('sheetAvatar');
    const sheetUserName = document.getElementById('sheetUserName');
    const sheetUserEmail = document.getElementById('sheetUserEmail');
    const sheetStatusDot = document.getElementById('sheetStatusDot');
    const memberUserName = document.getElementById('memberUserName');

    // Utility XSS Escaper
    function escapeHTML(str) {
      if (!str) return '';
      return String(str).replace(/[&<>"']/g, function(m) {
        return {
          '&': '&amp;',
          '<': '&lt;',
          '>': '&gt;',
          '"': '&quot;',
          "'": '&#039;'
        }[m];
      });
    }

    // Toggle Navigation & Sidebar Drawers
    toggleNavBtn.addEventListener('click', () => {
      navWrapper.classList.toggle('active');
      membersSidebar.classList.remove('mobile-open');
    });

    toggleMembersBtn.addEventListener('click', () => {
      membersSidebar.classList.toggle('mobile-open');
      navWrapper.classList.remove('active');
    });

    // Profile Sheet Drawer Handlers
    userProfileBar.addEventListener('click', () => {
      profileOverlay.classList.add('active');
      profileSheet.classList.add('active');
    });

    profileOverlay.addEventListener('click', () => {
      profileOverlay.classList.remove('active');
      profileSheet.classList.remove('active');
    });

    // Auth Mode Toggler (Login vs Register)
    authToggleAction.addEventListener('click', () => {
      isRegisterMode = !isRegisterMode;
      authErrorMsg.style.display = 'none';
      if (isRegisterMode) {
        authModalTitle.innerHTML = '<i class="fa-solid fa-user-plus" style="color: var(--accent-blue);"></i> Create DisCloud Account';
        usernameFieldGroup.style.display = 'flex';
        authSubmitBtn.textContent = 'Register';
        authToggleText.innerHTML = 'Already have an account? <span id="authToggleAction">Log In</span>';
      } else {
        authModalTitle.innerHTML = '<i class="fa-solid fa-right-to-bracket" style="color: var(--accent-blue);"></i> Welcome to DisCloud';
        usernameFieldGroup.style.display = 'none';
        authSubmitBtn.textContent = 'Log In';
        authToggleText.innerHTML = 'Need an account? <span id="authToggleAction">Register</span>';
      }
      document.getElementById('authToggleAction').addEventListener('click', arguments.callee);
    });

    // Rebind toggle action safely
    authToggleText.addEventListener('click', (e) => {
      if (e.target.id === 'authToggleAction') {
        isRegisterMode = !isRegisterMode;
        authErrorMsg.style.display = 'none';
        if (isRegisterMode) {
          authModalTitle.innerHTML = '<i class="fa-solid fa-user-plus" style="color: var(--accent-blue);"></i> Create DisCloud Account';
          usernameFieldGroup.style.display = 'flex';
          authSubmitBtn.textContent = 'Register';
          authToggleText.innerHTML = 'Already have an account? <span id="authToggleAction">Log In</span>';
        } else {
          authModalTitle.innerHTML = '<i class="fa-solid fa-right-to-bracket" style="color: var(--accent-blue);"></i> Welcome to DisCloud';
          usernameFieldGroup.style.display = 'none';
          authSubmitBtn.textContent = 'Log In';
          authToggleText.innerHTML = 'Need an account? <span id="authToggleAction">Register</span>';
        }
      }
    });

    // Handle Authentication Submit (Login / Register)
    authSubmitBtn.addEventListener('click', async () => {
      authErrorMsg.style.display = 'none';
      const email = authEmailInput.value.trim();
      const password = authPasswordInput.value.trim();
      const username = authUsernameInput.value.trim();

      if (!email || !password || (isRegisterMode && !username)) {
        authErrorMsg.textContent = 'Please fill out all required fields.';
        authErrorMsg.style.display = 'block';
        return;
      }

      authSubmitBtn.disabled = true;
      authSubmitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Processing...';

      const endpoint = isRegisterMode ? '/register' : '/login';
      const payload = isRegisterMode ? { username, email, password } : { email, password };

      try {
        const response = await fetch(`${API_BASE_URL}${endpoint}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const data = await response.json();
        if (!response.ok) {
          throw new Error(data.error || data.message || 'Authentication failed');
        }

        // Save Token & User Session
        authToken = data.token || data.access_token;
        if (!authToken) throw new Error('No access token returned from backend.');

        localStorage.setItem('discloud_auth_token', authToken);
        authModalOverlay.classList.add('hidden');
        await fetchUserDataAndApp();
      } catch (err) {
        authErrorMsg.textContent = err.message;
        authErrorMsg.style.display = 'block';
      } finally {
        authSubmitBtn.disabled = false;
        authSubmitBtn.textContent = isRegisterMode ? 'Register' : 'Log In';
      }
    });

    // Handle Logout
    logoutBtn.addEventListener('click', async () => {
      try {
        if (authToken) {
          await fetch(`${API_BASE_URL}/logout`, {
            method: 'POST',
            headers: { 'Authorization': `Bearer ${authToken}` }
          });
        }
      } catch (e) {
        console.error('Logout error:', e);
      } finally {
        localStorage.removeItem('discloud_auth_token');
        authToken = null;
        currentUser = null;
        authModalOverlay.classList.remove('hidden');
      }
    });

    // Session Verification & User Profile Loader
    async function fetchUserDataAndApp() {
      if (!authToken) {
        authModalOverlay.classList.remove('hidden');
        return;
      }

      try {
        const res = await fetch(`${API_BASE_URL}/me`, {
          method: 'GET',
          headers: { 'Authorization': `Bearer ${authToken}` }
        });

        if (!res.ok) throw new Error('Session expired or invalid');
        const data = await res.json();
        currentUser = data.user || data;

        updateUserProfileUI();
        authModalOverlay.classList.add('hidden');
        renderWorkspace();
        setupChannelListeners();
      } catch (err) {
        console.error('Session validation failed:', err);
        localStorage.removeItem('discloud_auth_token');
        authToken = null;
        authModalOverlay.classList.remove('hidden');
      }
    }

    function updateUserProfileUI() {
      if (!currentUser) return;
      const uname = currentUser.username || currentUser.email || 'User';
      const utag = currentUser.tag || '#1337';
      const uemail = currentUser.email || 'user@example.com';
      const initial = uname.charAt(0).toUpperCase();

      barUserName.textContent = uname;
      barUserTag.textContent = utag;
      barAvatar.textContent = initial;

      sheetUserName.textContent = uname;
      sheetUserEmail.textContent = uemail;
      sheetAvatar.textContent = initial;
      memberUserName.textContent = uname;
    }

    // Setup Channel Switching
    function setupChannelListeners() {
      document.querySelectorAll('.channel-item').forEach(item => {
        item.addEventListener('click', () => {
          document.querySelectorAll('.channel-item').forEach(i => i.classList.remove('active'));
          item.classList.add('active');
          currentChannelId = item.getAttribute('data-id');
          const channelNameSpan = item.querySelector('span');
          headerChannelName.textContent = channelNameSpan ? channelNameSpan.textContent : 'chat';
          channelHeaderIcon.className = currentChannelId === 'friends' ? 'fa-solid fa-user' : 'fa-solid fa-hashtag';
          
          renderWorkspace();
          navWrapper.classList.remove('active');
        });
      });
    }

    // Render Workspace (Friends view or Chat room)
    function renderWorkspace() {
      if (currentChannelId === 'friends') {
        renderFriendsHomeView();
      } else {
        renderChatRoomView();
      }
    }

    function renderFriendsHomeView() {
      mainWorkspaceArea.innerHTML = `
        <div class="home-view-container">
          <div class="friends-header-tabs">
            <button class="friend-tab-btn active"><i class="fa-solid fa-user-group" style="margin-right:6px;"></i> Online</button>
          </div>
          <div class="friends-content-body">
            <div class="friends-list-pane">
              <div class="members-group-title" style="margin-bottom: 8px;">Active User — 1 Online</div>
              <div class="friend-row">
                <div class="user-info">
                  <div class="avatar-wrap">
                    <div class="avatar">${currentUser ? currentUser.username.charAt(0).toUpperCase() : 'U'}</div>
                    <div class="status-dot online"></div>
                  </div>
                  <div class="user-details">
                    <div class="user-name">${escapeHTML(currentUser ? currentUser.username : 'User')}</div>
                    <div class="user-tag">Active on DisCloud</div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    async function renderChatRoomView() {
      mainWorkspaceArea.innerHTML = `
        <div class="messages-container" id="messagesContainer">
          <div style="display:flex; align-items:center; justify-content:center; height:100%; color:var(--text-secondary);">
            <i class="fa-solid fa-spinner fa-spin" style="margin-right:8px;"></i> Loading messages...
          </div>
        </div>
        <div class="message-input-area">
          <div class="message-input-wrapper">
            <textarea class="message-input" id="messageInput" rows="1" placeholder="Message #general..."></textarea>
            <button class="icon-btn" id="sendMsgBtn" style="color: var(--accent-blue);"><i class="fa-solid fa-paper-plane"></i></button>
          </div>
        </div>
      `;

      await loadAndDisplayMessages();

      const messageInput = document.getElementById('messageInput');
      const sendMsgBtn = document.getElementById('sendMsgBtn');

      const submitAction = async () => {
        const text = messageInput.value.trim();
        if (!text) return;

        sendMsgBtn.disabled = true;
        sendMsgBtn.style.opacity = '0.5';

        try {
          const res = await fetch(`${API_BASE_URL}/messages`, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': `Bearer ${authToken}`
            },
            body: JSON.stringify({ text })
          });

          if (!res.ok) throw new Error('Failed to send message');
          messageInput.value = '';
          await loadAndDisplayMessages();
        } catch (err) {
          console.error('Send message error:', err);
          alert('Could not send message. Please try again.');
        } finally {
          sendMsgBtn.disabled = false;
          sendMsgBtn.style.opacity = '1';
        }
      };

      sendMsgBtn.addEventListener('click', submitAction);
      messageInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          submitAction();
        }
      });
    }

    async function loadAndDisplayMessages() {
      const msgContainer = document.getElementById('messagesContainer');
      if (!msgContainer) return;

      try {
        const res = await fetch(`${API_BASE_URL}/messages`, {
          method: 'GET',
          headers: { 'Authorization': `Bearer ${authToken}` }
        });

        if (!res.ok) throw new Error('Failed to load messages');
        const data = await res.json();
        const messages = data.messages || [];

        msgContainer.innerHTML = '';
        if (messages.length === 0) {
          msgContainer.innerHTML = `<div style="color:var(--text-secondary); text-align:center; margin-top:20px;">No messages in #general yet. Start the conversation!</div>`;
          return;
        }

        messages.forEach(m => {
          const msgDiv = document.createElement('div');
          msgDiv.className = 'message';
          const author = m.username || 'User';
          const time = m.time || 'Just now';
          const initial = author.charAt(0).toUpperCase();

          msgDiv.innerHTML = `
            <div class="avatar" style="width:36px; height:36px; font-size:14px; flex-shrink:0;">${escapeHTML(initial)}</div>
            <div class="message-content">
              <div class="message-header">
                <span class="message-author">${escapeHTML(author)}</span>
                <span class="message-time">${escapeHTML(time)}</span>
              </div>
              <div class="message-text">${escapeHTML(m.text)}</div>
            </div>
          `;
          msgContainer.appendChild(msgDiv);
        });

        msgContainer.scrollTop = msgContainer.scrollHeight;
      } catch (err) {
        console.error('Load messages error:', err);
        msgContainer.innerHTML = `<div style="color:var(--accent-red); text-align:center; margin-top:20px;">Failed to load messages from backend.</div>`;
      }
    }

    // Initial Execution
    fetchUserDataAndApp();
  </script>
</body>
</html>
