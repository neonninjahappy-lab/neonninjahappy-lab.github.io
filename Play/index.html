<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CloudFurm</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body { background-color: #e3e3e3; color: #111111; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; width: 100vw; min-height: 100vh; display: flex; flex-direction: column; overflow-x: hidden; }
        .app-container { width: 100%; min-height: 100vh; background-color: #e3e3e3; display: flex; flex-direction: column; position: relative; }
        .header { display: flex; justify-content: space-between; align-items: center; padding: 10px 20px; background-color: #0074bd; width: 100%; z-index: 100; color: #ffffff; }
        .header-left, .header-right { display: flex; align-items: center; gap: 16px; }
        .brand-logo { font-family: 'Orbitron', sans-serif; font-size: 18px; font-weight: 800; color: #ffffff; text-decoration: none; }
        .icon-btn { background: transparent; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 0; }
        .icon-btn svg { width: 24px; height: 24px; fill: #ffffff; }
        
        /* Search Overlay Bar */
        .search-bar-container { display: none; background: #005a96; padding: 10px 20px; width: 100%; gap: 10px; align-items: center; }
        .search-bar-container.active { display: flex; }
        .search-input { width: 100%; padding: 8px 12px; border-radius: 4px; border: none; outline: none; font-size: 14px; }

        .sub-nav { display: flex; justify-content: space-between; align-items: center; padding: 8px 20px; background-color: #005a96; border-bottom: 1px solid #00487a; width: 100%; overflow-x: auto; gap: 20px; }
        @media (min-width: 768px) { .sub-nav { display: none; } }
        .nav-item { background: transparent; border: none; color: #bce0fd; font-size: 15px; font-weight: 500; cursor: pointer; white-space: nowrap; }
        .nav-item.active { color: #ffffff; font-weight: 700; }
        .content { flex: 1; background-color: #e3e3e3; width: 100%; padding: 20px; max-width: 1200px; margin: 0 auto; }
        .section-title { font-size: 18px; font-weight: 700; margin-bottom: 12px; color: #333333; }
        .grid-container { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
        @media (min-width: 768px) { .grid-container { grid-template-columns: repeat(4, 1fr); } }
        .template-box { display: flex; flex-direction: column; gap: 6px; cursor: pointer; background: #ffffff; padding: 8px; border-radius: 4px; border: 1px solid #dcdcdc; }
        .box-thumbnail { width: 100%; aspect-ratio: 16 / 10; background-color: #cccccc; border-radius: 2px; background-size: cover; background-position: center; }
        .box-title { font-size: 13px; font-weight: 600; color: #0074bd; }
        .box-subtitle { font-size: 11px; color: #666666; }

        /* Sidebar Elements */
        .sidebar-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background-color: rgba(0,0,0,0.4); z-index: 999; opacity: 0; visibility: hidden; transition: 0.3s; }
        .sidebar-overlay.open { opacity: 1; visibility: visible; }
        .sidebar { position: fixed; top: 0; left: -250px; width: 220px; height: 100vh; background-color: #ffffff; z-index: 1000; display: flex; flex-direction: column; transition: left 0.3s ease; border-right: 1px solid #dcdcdc; }
        .sidebar.open { left: 0; }
        .sidebar-profile { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 20px 15px; border-bottom: 1px solid #eeeeee; background: #f9f9f9; text-align: center; }
        .sidebar-avatar { width: 60px; height: 60px; border-radius: 50%; background-color: #e0e0e0; background-image: url('CloudPlayer.png'); background-size: cover; background-position: center; border: 2px solid #cccccc; }
        .sidebar-username { font-size: 14px; font-weight: 700; color: #333333; width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .sidebar-menu { display: flex; flex-direction: column; padding: 5px 0; flex: 1; overflow-y: auto; }
        .sidebar-link { display: flex; align-items: center; justify-content: space-between; padding: 10px 15px; color: #333333; text-decoration: none; font-size: 13px; font-weight: 500; background: transparent; border: none; width: 100%; cursor: pointer; text-align: left; }
        .sidebar-link:hover { background-color: #0074bd; color: #ffffff; }
        .sidebar-link:hover svg { fill: #ffffff; }
        .sidebar-link-content { display: flex; align-items: center; gap: 12px; }
        .sidebar-link svg { width: 18px; height: 18px; fill: #666666; }
        .sidebar-badge { background-color: #0074bd; color: #ffffff; font-size: 10px; padding: 2px 6px; border-radius: 10px; }

        /* Auth Modal */
        .auth-modal-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background-color: rgba(0,0,0,0.5); z-index: 2000; display: none; align-items: center; justify-content: center; padding: 16px; }
        .auth-modal-overlay.open { display: flex; }
        .auth-card { background-color: #ffffff; border-radius: 6px; width: 100%; max-width: 400px; padding: 20px; display: flex; flex-direction: column; gap: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.15); }
        .auth-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #eeeeee; padding-bottom: 8px; }
        .auth-title { font-size: 18px; font-weight: 700; }
        .auth-close-btn { background: transparent; border: none; font-size: 18px; cursor: pointer; }
        .auth-form { display: flex; flex-direction: column; gap: 12px; }
        .auth-field { display: flex; flex-direction: column; gap: 4px; }
        .auth-label { font-size: 12px; font-weight: 600; color: #555555; }
        .auth-input { border: 1px solid #cccccc; border-radius: 4px; padding: 10px; font-size: 14px; outline: none; }
        .auth-submit-btn { background-color: #0074bd; color: #ffffff; border: none; border-radius: 4px; padding: 10px; font-weight: 700; cursor: pointer; }
        .auth-message { font-size: 12px; padding: 8px; border-radius: 4px; display: none; }
        .auth-message.error { background-color: #ffebee; color: #c62828; border: 1px solid #ef9a9a; display: block; }
        .auth-switch-link { color: #0074bd; background: transparent; border: none; cursor: pointer; font-weight: 600; text-decoration: underline; }
    </style>
</head>
<body>

    <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>

    <div class="auth-modal-overlay" id="authModalOverlay">
        <div class="auth-card" id="authCardContainer"></div>
    </div>

    <aside class="sidebar" id="sidebarDrawer">
        <div class="sidebar-profile" id="sidebarProfileContainer"></div>
        <div class="sidebar-menu">
            <a href="#" class="sidebar-link" onclick="showHome(); return false;">
                <div class="sidebar-link-content"><svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>Home</div>
            </a>
            <a href="#" class="sidebar-link">
                <div class="sidebar-link-content"><svg viewBox="0 0 24 24"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3z"/></svg>Friends</div>
                <span class="sidebar-badge" id="friendsCount">0</span>
            </a>
            <div id="sidebarLogoutContainer"></div>
        </div>
    </aside>

    <div class="app-container">
        <header class="header">
            <div class="header-left">
                <button class="icon-btn" onclick="toggleSidebar()"><svg viewBox="0 0 24 24"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg></button>
                <a href="#" class="brand-logo" onclick="showHome(); return false;">CloudFurm</a>
            </div>
            <div class="header-right">
                <button class="icon-btn" onclick="toggleSearch()"><svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5z"/></svg></button>
                <button class="icon-btn" onclick="openAuthModal('login')"><svg viewBox="0 0 24 24"><path d="M19.14 12.94c...'/></svg></button>
            </div>
        </header>

        <div class="search-bar-container" id="searchBarContainer">
            <input type="text" class="search-input" id="searchInput" placeholder="Search games or friends..." oninput="filterContent(this.value)">
        </div>

        <main class="content">
            <div id="homeView">
                <h2 class="section-title">Recommended For You</h2>
                <div class="grid-container" id="gamesGrid">
                    <div class="template-box" data-name="cloudfurm">
                        <div class="box-thumbnail" style="background-image: url('game1.png');"></div>
                        <div class="box-title">CloudFurm</div>
                        <div class="box-subtitle">92% Rating</div>
                    </div>
                    <div class="template-box" data-name="api obby">
                        <div class="box-thumbnail" style="background-image: url('game2.png');"></div>
                        <div class="box-title">API obby</div>
                        <div class="box-subtitle">95% Rating</div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        const SUPABASE_URL = 'https://rclhtycpyhpsajaxqnyu.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        function toggleSidebar() {
            document.getElementById('sidebarDrawer').classList.toggle('open');
            document.getElementById('sidebarOverlay').classList.toggle('open');
        }

        function toggleSearch() {
            document.getElementById('searchBarContainer').classList.toggle('active');
        }

        function filterContent(query) {
            const boxes = document.querySelectorAll('.template-box');
            query = query.toLowerCase();
            boxes.forEach(box => {
                const name = box.getAttribute('data-name');
                box.style.display = name.includes(query) ? 'flex' : 'none';
            });
        }

        const authModalOverlay = document.getElementById('authModalOverlay');
        const authCardContainer = document.getElementById('authCardContainer');

        function openAuthModal(type) {
            authModalOverlay.classList.add('open');
            if (type === 'login') renderLoginView();
            else renderSignupView();
        }

        function closeAuthModal() { authModalOverlay.classList.remove('open'); }

        function renderSignupView(err = '') {
            authCardContainer.innerHTML = `
                <div class="auth-header"><h3 class="auth-title">Create Account</h3><button class="auth-close-btn" onclick="closeAuthModal()">×</button></div>
                ${err ? `<div class="auth-message error">${err}</div>` : ''}
                <form class="auth-form" onsubmit="handleSignUp(event)">
                    <div class="auth-field"><label class="auth-label">Username</label><input type="text" id="suUser" class="auth-input" required></div>
                    <div class="auth-field"><label class="auth-label">Password</label><input type="password" id="suPass" class="auth-input" required></div>
                    <button type="submit" class="auth-submit-btn">Sign Up</button>
                </form>
                <div style="font-size:12px; text-align:center;">Have an account? <button class="auth-switch-link" onclick="openAuthModal('login')">Log In</button></div>`;
        }

        function renderLoginView(err = '') {
            authCardContainer.innerHTML = `
                <div class="auth-header"><h3 class="auth-title">Log In</h3><button class="auth-close-btn" onclick="closeAuthModal()">×</button></div>
                ${err ? `<div class="auth-message error">${err}</div>` : ''}
                <form class="auth-form" onsubmit="handleLogin(event)">
                    <div class="auth-field"><label class="auth-label">Username</label><input type="text" id="liUser" class="auth-input" required></div>
                    <div class="auth-field"><label class="auth-label">Password</label><input type="password" id="liPass" class="auth-input" required></div>
                    <button type="submit" class="auth-submit-btn">Log In</button>
                </form>
                <div style="font-size:12px; text-align:center;">No account? <button class="auth-switch-link" onclick="openAuthModal('signup')">Sign Up</button></div>`;
        }

        async function handleSignUp(e) {
            e.preventDefault();
            const u = document.getElementById('suUser').value.trim().toLowerCase();
            const p = document.getElementById('suPass').value;
            const { data, error } = await supabaseClient.auth.signUp({ email: `${u}@cloudfurm.com`, password: p, options: { data: { username: u } } });
            if (error) { renderSignupView(error.message); return; }
            closeAuthModal();
            if (data?.session) updateUI(data.session.user);
        }

        async function handleLogin(e) {
            e.preventDefault();
            const u = document.getElementById('liUser').value.trim().toLowerCase();
            const p = document.getElementById('liPass').value;
            const { data, error } = await supabaseClient.auth.signInWithPassword({ email: `${u}@cloudfurm.com`, password: p });
            if (error) { renderLoginView('Invalid credentials.'); return; }
            closeAuthModal();
            updateUI(data.session.user);
        }

        async function handleLogout() {
            await supabaseClient.auth.signOut();
            updateUI(null);
        }

        function updateUI(user) {
            const profileContainer = document.getElementById('sidebarProfileContainer');
            const logoutContainer = document.getElementById('sidebarLogoutContainer');
            
            if (user) {
                const username = user.user_metadata?.username || user.email.split('@')[0];
                profileContainer.innerHTML = `<div class="sidebar-avatar"></div><div class="sidebar-username">${username}</div>`;
                logoutContainer.innerHTML = `<button class="sidebar-link" onclick="handleLogout()"><div class="sidebar-link-content"><svg viewBox="0 0 24 24"><path d="M17 7l-1.41 1.41L18.17 11H8v2h10.17l-2.58 2.58L17 17l5-5z"/></svg>Logout</div></button>`;
            } else {
                profileContainer.innerHTML = `<div class="sidebar-avatar"></div><div style="font-weight:700;">CloudFurm</div>`;
                logoutContainer.innerHTML = `<div style="display:flex; gap:8px; padding:10px 15px;"><button onclick="openAuthModal('login')" style="flex:1; background:#0074bd; color:#fff; border:none; padding:6px; border-radius:4px; cursor:pointer;">Log In</button><button onclick="openAuthModal('signup')" style="flex:1; background:#f1f1f1; border:1px solid #ccc; padding:6px; border-radius:4px; cursor:pointer;">Sign Up</button></div>`;
            }
        }

        window.addEventListener('DOMContentLoaded', async () => {
            const { data: { session } } = await supabaseClient.auth.getSession();
            updateUI(session?.user || null);
            supabaseClient.auth.onAuthStateChange((_, session) => updateUI(session?.user || null));
        });
    </script>
</body>
</html>
