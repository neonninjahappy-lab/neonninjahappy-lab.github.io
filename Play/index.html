<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CloudFurm</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&display=swap" rel="stylesheet">
    <!-- Supabase JavaScript v2 Browser Client CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #121214;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            width: 100vw;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        .app-container {
            width: 100%;
            min-height: 100vh;
            background-color: #121214;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 20px 10px 20px;
            background-color: #161618;
            width: 100%;
            z-index: 100;
        }

        .header-left, .header-right {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .brand-logo {
            font-family: 'Orbitron', sans-serif;
            font-size: 18px;
            font-weight: 800;
            letter-spacing: 0.5px;
            background: linear-gradient(135deg, #ffffff 30%, #3b82f6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 2px 10px rgba(59, 130, 246, 0.3);
            text-decoration: none;
        }

        .icon-btn {
            background: transparent;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
        }

        .icon-btn svg {
            width: 24px;
            height: 24px;
            fill: #ffffff;
        }

        .sub-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 20px 12px 20px;
            background-color: #161618;
            border-bottom: 1px solid #1f1f23;
            width: 100%;
            overflow-x: auto;
            gap: 20px;
        }

        @media (min-width: 768px) {
            .sub-nav {
                display: none;
            }
        }

        .nav-item {
            background: transparent;
            border: none;
            color: #73737b;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            padding-bottom: 2px;
            letter-spacing: -0.2px;
            white-space: nowrap;
        }

        .nav-item.active {
            color: #ffffff;
        }

        .content {
            flex: 1;
            background-color: #121214;
            width: 100%;
            padding: 20px;
        }

        .section-title {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 16px;
            color: #ffffff;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
        }

        @media (min-width: 768px) {
            .grid-container {
                grid-template-columns: repeat(4, 1fr);
            }
        }

        .template-box {
            display: flex;
            flex-direction: column;
            gap: 8px;
            cursor: pointer;
        }

        .box-thumbnail {
            width: 100%;
            aspect-ratio: 16 / 10;
            background-color: #26262a;
            border-radius: 12px;
            overflow: hidden;
            background-size: cover;
            background-position: center;
            transition: transform 0.2s ease;
        }

        .template-box:hover .box-thumbnail {
            transform: scale(1.02);
        }

        .box-title {
            font-size: 14px;
            font-weight: 600;
            color: #ffffff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .box-subtitle {
            font-size: 12px;
            color: #73737b;
        }

        /* --- GAME DETAILS VIEW STYLES --- */
        .game-details-view {
            display: none;
            flex-direction: column;
            gap: 20px;
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
        }

        .game-details-view.active {
            display: flex;
        }

        .details-thumbnail {
            width: 100%;
            aspect-ratio: 16 / 9;
            background-color: #26262a;
            border-radius: 12px;
            background-size: cover;
            background-position: center;
        }

        /* Header Row: Game info on left, balanced clean Play Button */
        .details-header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
        }

        .details-title-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
            min-width: 0;
            flex: 1;
        }

        .details-game-name {
            font-size: 26px;
            font-weight: 800;
            color: #ffffff;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .details-creator {
            font-size: 14px;
            color: #73737b;
        }

        .details-maturity {
            font-size: 13px;
            color: #55555d;
        }

        /* Fixed Play Button height: reduced vertical padding so it isn't massive */
        .details-play-btn {
            background-color: #00b06f;
            color: #ffffff;
            border: none;
            border-radius: 12px;
            padding: 12px 24px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-weight: 700;
            font-size: 16px;
            transition: background-color 0.2s;
            flex-shrink: 0;
        }

        .details-play-btn:hover {
            background-color: #00965f;
        }

        .details-play-btn svg {
            width: 22px;
            height: 22px;
            fill: #ffffff;
        }

        /* Interaction Stats Bar */
        .details-stats-row {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            align-items: center;
            background-color: transparent;
            padding: 10px 0;
        }

        .stat-btn-col {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            background: transparent;
            border: none;
            cursor: pointer;
            color: #8e8e93;
            font-size: 12px;
            font-weight: 600;
        }

        .stat-btn-col svg {
            width: 24px;
            height: 24px;
            fill: #8e8e93;
        }

        .stat-btn-col:hover, .stat-btn-col:hover svg {
            color: #ffffff;
            fill: #ffffff;
        }

        .details-tabs {
            display: flex;
            justify-content: space-around;
            border-bottom: 1px solid #1f1f23;
            padding-bottom: 4px;
            margin-top: 10px;
        }

        .details-tab-item {
            background: transparent;
            border: none;
            color: #73737b;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            padding: 8px 16px;
            position: relative;
        }

        .details-tab-item.active {
            color: #ffffff;
        }

        .details-tab-item.active::after {
            content: '';
            position: absolute;
            bottom: -5px;
            left: 0;
            width: 100%;
            height: 3px;
            background-color: #ffffff;
            border-radius: 2px 2px 0 0;
        }

        .sidebar-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(2px);
            z-index: 999;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }

        .sidebar-overlay.open {
            opacity: 1;
            visibility: visible;
        }

        .sidebar {
            position: fixed;
            top: 0;
            left: -300px;
            width: 280px;
            height: 100vh;
            background-color: #161618;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            transition: left 0.35s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 5px 0 25px rgba(0, 0, 0, 0.5);
        }

        .sidebar.open {
            left: 0;
        }

        .sidebar-profile {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 20px;
            border-bottom: 1px solid #222226;
        }

        .sidebar-avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background-color: #2c2c33;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border: 1px solid #3a3a42;
            flex-shrink: 0;
        }

        .sidebar-avatar svg {
            width: 32px;
            height: 32px;
            fill: #8e8e99;
            margin-top: 6px;
        }

        .sidebar-username {
            font-size: 16px;
            font-weight: 600;
            color: #ffffff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .sidebar-menu {
            display: flex;
            flex-direction: column;
            padding: 10px 0;
            flex: 1;
        }

        .sidebar-link {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 20px;
            color: #d1d1d6;
            text-decoration: none;
            font-size: 15px;
            font-weight: 500;
            transition: background-color 0.15s ease, color 0.15s ease;
            background: transparent;
            border: none;
            width: 100%;
            text-align: left;
            cursor: pointer;
        }

        .sidebar-link:hover {
            background-color: #222226;
            color: #ffffff;
        }

        .sidebar-link-content {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .sidebar-link svg {
            width: 22px;
            height: 22px;
            fill: currentColor;
        }

        .sidebar-badge {
            background-color: #ffffff;
            color: #161618;
            font-size: 12px;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 12px;
        }

        .sidebar-action-container {
            padding: 16px 20px;
        }

        .sidebar-plus-btn {
            width: 100%;
            background-color: #ffffff;
            color: #121214;
            border: none;
            border-radius: 12px;
            padding: 12px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: background-color 0.15s ease, transform 0.1s ease;
        }

        .sidebar-plus-btn:hover {
            background-color: #e5e5e5;
        }

        .sidebar-plus-btn:active {
            transform: scale(0.98);
        }

        /* --- AUTH MODAL STYLES --- */
        .auth-modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(4px);
            z-index: 2000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }

        .auth-modal-overlay.open {
            display: flex;
        }

        .auth-card {
            background-color: #161618;
            border: 1px solid #1f1f23;
            border-radius: 16px;
            width: 100%;
            max-width: 400px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            max-height: 90vh;
            overflow-y: auto;
        }

        .auth-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .auth-title {
            font-size: 20px;
            font-weight: 700;
            color: #ffffff;
        }

        .auth-close-btn {
            background: transparent;
            border: none;
            color: #73737b;
            cursor: pointer;
            font-size: 20px;
            padding: 4px;
        }

        .auth-close-btn:hover {
            color: #ffffff;
        }

        .auth-form {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .auth-field {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .auth-label {
            font-size: 13px;
            font-weight: 600;
            color: #73737b;
        }

        .auth-input {
            background-color: #121214;
            border: 1px solid #1f1f23;
            border-radius: 8px;
            padding: 12px 14px;
            color: #ffffff;
            font-size: 15px;
            outline: none;
            width: 100%;
            transition: border-color 0.2s;
        }

        .auth-input:focus {
            border-color: #3b82f6;
        }

        .auth-submit-btn {
            background-color: #3b82f6;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            padding: 12px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 6px;
            transition: background-color 0.2s;
        }

        .auth-submit-btn:hover {
            background-color: #2563eb;
        }

        .auth-message {
            font-size: 13px;
            padding: 10px;
            border-radius: 6px;
            display: none;
        }

        .auth-message.error {
            background-color: rgba(239, 68, 68, 0.15);
            color: #ef4444;
            border: 1px solid rgba(239, 68, 68, 0.3);
            display: block;
        }

        .auth-message.success {
            background-color: rgba(16, 185, 129, 0.15);
            color: #10b981;
            border: 1px solid rgba(16, 185, 129, 0.3);
            display: block;
        }

        .auth-switch-text {
            font-size: 14px;
            color: #73737b;
            text-align: center;
            margin-top: 4px;
        }

        .auth-switch-link {
            color: #3b82f6;
            background: transparent;
            border: none;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            padding: 0;
            text-decoration: underline;
        }

        .auth-switch-link:hover {
            color: #60a5fa;
        }

        .auth-forgot-link {
            background: transparent;
            border: none;
            color: #73737b;
            font-size: 13px;
            cursor: pointer;
            text-align: right;
            padding: 0;
        }

        .auth-forgot-link:hover {
            color: #ffffff;
        }
    </style>
</head>
<body>

    <!-- Auth Modal View Container -->
    <div class="auth-modal-overlay" id="authModalOverlay">
        <div class="auth-card" id="authCardContainer">

        </div>
    </div>

        <div class="sidebar-action-container">

    </aside>

    <div class="app-container">
        <header class="header">
            <div class="header-left">
                <button class="icon-btn" aria-label="Menu" onclick="toggleSidebar()">
                    <svg viewBox="0 0 24 24">
                        <path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/>
                    </svg>
                </button>
                <a href="#" class="brand-logo" onclick="showHome(); return false;">CloudFurm</a>
            </div>
            <div class="header-right">
                <button class="icon-btn" aria-label="Search">
                    <svg viewBox="0 0 24 24">
                        <path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
                    </svg>
                </button>
                <button class="icon-btn" aria-label="Settings" onclick="openAuthModal('login')">
                    <svg viewBox="0 0 24 24">

    <script>
        // Supabase Initialization
        const SUPABASE_URL = 'https://sovoxfrckytkmrqwvraa.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_Nps2PC7MmBK9d9RcIQ_HQw_NSmIlgJF';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // Sidebar & View Management
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebarDrawer');
            const overlay = document.getElementById('sidebarOverlay');
            
            sidebar.classList.toggle('open');
            overlay.classList.toggle('open');
        }

        function openGameDetails(gameTitle, gameRating, imageFileName) {
            document.getElementById('detailsTitle').innerText = gameTitle;
            document.getElementById('detailsThumbnail').style.backgroundImage = `url('${imageFileName}')`;
            document.getElementById('homeView').style.display = 'none';
            document.getElementById('gameDetailsView').classList.add('active');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function showHome() {
            document.getElementById('gameDetailsView').classList.remove('active');
            document.getElementById('homeView').style.display = 'block';
            
            const sidebar = document.getElementById('sidebarDrawer');
            const overlay = document.getElementById('sidebarOverlay');
            if (sidebar.classList.contains('open')) {
                sidebar.classList.remove('open');
                overlay.classList.remove('open');
            }
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // --- AUTHENTICATION UI & FLOWS ---
        const authModalOverlay = document.getElementById('authModalOverlay');
        const authCardContainer = document.getElementById('authCardContainer');
        const sidebarProfileContainer = document.getElementById('sidebarProfileContainer');
        const sidebarLogoutContainer = document.getElementById('sidebarLogoutContainer');

        function openAuthModal(viewType) {
            authModalOverlay.classList.add('open');
            if (viewType === 'login') renderLoginView();
            else if (viewType === 'signup') renderSignupView();
            else if (viewType === 'forgot') renderForgotView();
        }

        function closeAuthModal() {
            authModalOverlay.classList.remove('open');
        }

        authModalOverlay.addEventListener('click', (e) => {
            if (e.target === authModalOverlay) {
                closeAuthModal();
            }
        });

        function renderSignupView(errorMessage = '', successMessage = '') {
            authCardContainer.innerHTML = `
                <div class="auth-header">
                    <h3 class="auth-title">Create Account</h3>
                    <button class="auth-close-btn" onclick="closeAuthModal()">×</button>
                </div>
                ${errorMessage ? `<div class="auth-message error">${errorMessage}</div>` : ''}
                ${successMessage ? `<div class="auth-message success">${successMessage}</div>` : ''}
                <form class="auth-form" onsubmit="handleSignUp(event)">
                    <div class="auth-field">
                        <label class="auth-label">Username</label>
                        <input type="text" id="signupUsername" class="auth-input" placeholder="Enter username" required>
                    </div>
                    <div class="auth-field">
                        <label class="auth-label">Email</label>
                        <input type="email" id="signupEmail" class="auth-input" placeholder="Enter email" required>
                    </div>
                    <div class="auth-field">
                        <label class="auth-label">Password</label>
                        <input type="password" id="signupPassword" class="auth-input" placeholder="Enter password" required>
                    </div>
                    <div class="auth-field">
                        <label class="auth-label">Confirm Password</label>
                        <input type="password" id="signupConfirmPassword" class="auth-input" placeholder="Confirm password" required>
                    </div>
                    <button type="submit" class="auth-submit-btn">Create Account</button>
                </form>
                <div class="auth-switch-text">
                    Already have an account? <button class="auth-switch-link" onclick="openAuthModal('login')">Log In</button>
                </div>
            `;
        }

        function renderLoginView(errorMessage = '', successMessage = '') {
            authCardContainer.innerHTML = `
                <div class="auth-header">
                    <h3 class="auth-title">Log In</h3>
                    <button class="auth-close-btn" onclick="closeAuthModal()">×</button>
                </div>
                ${errorMessage ? `<div class="auth-message error">${errorMessage}</div>` : ''}
                ${successMessage ? `<div class="auth-message success">${successMessage}</div>` : ''}
                <form class="auth-form" onsubmit="handleLogin(event)">
                    <div class="auth-field">
                        <label class="auth-label">Email</label>
                        <input type="email" id="loginEmail" class="auth-input" placeholder="Enter email" required>
                    </div>
                    <div class="auth-field">
                        <label class="auth-label">Password</label>
                        <input type="password" id="loginPassword" class="auth-input" placeholder="Enter password" required>
                        <button type="button" class="auth-forgot-link" onclick="openAuthModal('forgot')">Forgot Password?</button>
                    </div>
                    <button type="submit" class="auth-submit-btn">Log In</button>
                </form>
                <div class="auth-switch-text">
                    Don't have an account? <button class="auth-switch-link" onclick="openAuthModal('signup')">Sign Up</button>
                </div>
            `;
        }

        function renderForgotView(errorMessage = '', successMessage = '') {
            authCardContainer.innerHTML = `
                <div class="auth-header">
                    <h3 class="auth-title">Reset Password</h3>
                    <button class="auth-close-btn" onclick="closeAuthModal()">×</button>
                </div>
                ${errorMessage ? `<div class="auth-message error">${errorMessage}</div>` : ''}
                ${successMessage ? `<div class="auth-message success">${successMessage}</div>` : ''}
                <form class="auth-form" onsubmit="handlePasswordReset(event)">
                    <div class="auth-field">
                        <label class="auth-label">Email Address</label>
                        <input type="email" id="resetEmail" class="auth-input" placeholder="Enter your registered email" required>
                    </div>
                    <button type="submit" class="auth-submit-btn">Send Reset Link</button>
                </form>
                <div class="auth-switch-text">
                    Remembered your password? <button class="auth-switch-link" onclick="openAuthModal('login')">Log In</button>
                </div>
            `;
        }

        async function handleSignUp(e) {
            e.preventDefault();
            const username = document.getElementById('signupUsername').value.trim();
            const email = document.getElementById('signupEmail').value.trim();
            const password = document.getElementById('signupPassword').value;
            const confirmPassword = document.getElementById('signupConfirmPassword').value;

            if (!username || !email || !password) {
                renderSignupView('Please fill out all fields.');
                return;
            }
            if (password !== confirmPassword) {
                renderSignupView('Passwords do not match.');
                return;
            }

            const { data, error } = await supabaseClient.auth.signUp({
                email: email,
                password: password,
                options: { data: { username: username } }
            });

            if (error) {
                renderSignupView(error.message);
                return;
            }

            if (data?.session) {
                closeAuthModal();
                updateUIState(data.session.user);
            } else {
                renderSignupView('', 'Account created. Check your email to verify.');
            }
        }

        async function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value;

            if (!email || !password) {
                renderLoginView('Please enter both email and password.');
                return;
            }

            const { data, error } = await supabaseClient.auth.signInWithPassword({
                email: email,
                password: password
            });

            if (error) {
                renderLoginView(error.message);
                return;
            }

            closeAuthModal();
            updateUIState(data.session.user);
        }

        async function handlePasswordReset(e) {
            e.preventDefault();
            const email = document.getElementById('resetEmail').value.trim();

            if (!email) {
                renderForgotView('Please enter your email address.');
                return;
            }

            const { error } = await supabaseClient.auth.resetPasswordForEmail(email, {
                redirectTo: window.location.href
            });

            if (error) {
                renderForgotView(error.message);
                return;
            }

            renderForgotView('', 'Password reset link sent to your email.');
        }

        async function handleLogout() {
            await supabaseClient.auth.signOut();
            updateUIState(null);
        }

        function updateUIState(user) {
            if (user) {
                const username = user.user_metadata?.username || user.email.split('@')[0];
                sidebarProfileContainer.innerHTML = `
                    <div class="sidebar-avatar">
                        <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
                    </div>
                    <div class="sidebar-username">${username}</div>
                `;
                sidebarLogoutContainer.innerHTML = `
                    <button class="sidebar-link" onclick="handleLogout()">
                        <div class="sidebar-link-content">
                            <svg viewBox="0 0 24 24"><path d="M17 7l-1.41 1.41L18.17 11H8v2h10.17l-2.58 2.58L17 17l5-5zM4 5h8V3H4c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h8v-2H4V5z"/></svg>
                            Logout
                        </div>
                    </button>
                `;
            } else {
                sidebarProfileContainer.innerHTML = `
                    <div class="sidebar-avatar">
                        <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
                    </div>
                    <div style="display: flex; flex-direction: column; gap: 4px; overflow: hidden;">
                        <div class="sidebar-username">CloudFurm</div>
                        <div style="font-size: 13px; color: #73737b;">Guest</div>
                    </div>
                `;
                sidebarLogoutContainer.innerHTML = `
                    <div style="display: flex; gap: 8px; padding: 12px 20px;">
                        <button onclick="openAuthModal('login')" style="flex: 1; background: #3b82f6; color: #fff; border: none; padding: 8px; border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 13px;">Log In</button>
                        <button onclick="openAuthModal('signup')" style="flex: 1; background: #26262a; color: #fff; border: 1px solid #1f1f23; padding: 8px; border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 13px;">Sign Up</button>
                    </div>
                `;
            }
        }

        async function initAuth() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            updateUIState(session?.user || null);

            supabaseClient.auth.onAuthStateChange((event, session) => {
                updateUIState(session?.user || null);
            });
        }

        window.addEventListener('DOMContentLoaded', initAuth);
    </script>
</body>
