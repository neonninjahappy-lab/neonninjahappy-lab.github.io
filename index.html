<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CloudFurm</title>
    <link rel="icon" type="image/webp" href="https://i.postimg.cc/zXPXv7tM/Boy-Cloudfurm.webp">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap');

        body {
            background: #110000;
            color: #ffffff;
            font-family: 'Poppins', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .grid-bg {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: 
                linear-gradient(rgba(255, 0, 0, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 0, 0, 0.03) 1px, transparent 1px);
            background-size: 30px 30px;
            z-index: 1;
            pointer-events: none;
        }

        .container {
            text-align: center;
            background: #1a0000;
            padding: 40px 30px;
            border-radius: 15px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.5);
            max-width: 400px;
            width: 100%;
            border: 1px solid #330000;
            position: relative;
            z-index: 10;
            box-sizing: border-box;
        }

        h1 {
            margin-top: 0;
            font-size: 32px;
            font-weight: 800;
            color: #ff4d4d;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }

        p {
            font-size: 15px;
            margin-bottom: 30px;
            color: #cccccc;
            line-height: 1.5;
            font-weight: 400;
        }

        .download-btn {
            background: #cc0000;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            width: 100%;
            box-sizing: border-box;
        }

        .download-btn:hover {
            background: #ff1a1a;
        }

        .download-btn:active {
            background: #990000;
        }

        .icon {
            width: 80px;
            height: 80px;
            object-fit: contain;
            margin-bottom: 20px;
        }

        /* Mobile Responsiveness */
        @media (max-width: 480px) {
            .container {
                padding: 30px 20px;
            }
            h1 {
                font-size: 28px;
            }
            .download-btn {
                padding: 15px 20px;
                font-size: 15px;
            }
        }
    </style>
</head>
<body>

    <div class="grid-bg"></div>

    <div class="container">
        <img src="https://i.postimg.cc/zXPXv7tM/Boy-Cloudfurm.webp" alt="CloudFurm Logo" class="icon">
        <h1>CloudFurm</h1>
        <p>Get the latest Android APK for CloudFurm. Click the button below to start your download.</p>
        
        <button class="download-btn" id="downloadBtn">Download for Android</button>
    </div>

    <script>
        document.getElementById('downloadBtn').addEventListener('click', function() {
            window.open("https://archive.org/download/cloud-furm-v.-2-beta/CloudFurm%20Beta%20V.2.apk", "_blank");
        });
    </script>

</body>
</html>
